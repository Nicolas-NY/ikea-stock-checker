name: IKEA Stock Checker

on:
  schedule:
    # Run daily at 9 AM Mexico City time
    - cron: '0 9 * * *'
      tz: 'America/Mexico_City'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send notification even if out of stock'
        required: false
        default: 'false'
        type: boolean

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check IKEA stock
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python check_stock.py
      
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -d "❌ IKEA Stock Checker failed - check GitHub Actions logs" \
            -H "Title: IKEA Stock Checker Error" \
            ${{ secrets.NTFY_TOPIC }}
